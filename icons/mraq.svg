<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#7f8de0"/>
      <stop offset="0.55" stop-color="#f6a38a"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.82" r="0.55">
      <stop offset="0" stop-color="#ffd23f" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffd23f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="body" gradientUnits="userSpaceOnUse" cx="210" cy="200" r="260">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="0.6" stop-color="#fbf1e6"/>
      <stop offset="1" stop-color="#f3d9cf"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .55 0"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#sky)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <rect width="512" height="512" filter="url(#grain)" style="mix-blend-mode:overlay" opacity=".55"/>

  <!-- Mraq: mrak, co je zároveň Q -->
  <g filter="url(#soft)" fill="url(#body)">
    <path d="M168 366
             C 116 366 86 330 92 292
             C 97 258 124 238 152 238
             C 150 184 196 140 252 140
             C 304 140 340 172 350 214
             C 392 214 426 248 424 292
             C 422 336 388 366 344 366
             Z"/>
    <path d="M322 338 C 344 380 372 404 408 402 C 418 401 426 396 430 388" fill="none" stroke="url(#body)" stroke-width="46" stroke-linecap="round"/>
  </g>

  <!-- oči: koukají stranou, víčka napůl spuštěná -->
  <g fill="#141414">
    <path d="M206 262 h52 v6 a26 30 0 0 1 -52 0 z" transform="translate(22 0)"/>
    <path d="M290 262 h52 v6 a26 30 0 0 1 -52 0 z" transform="translate(22 0)"/>
  </g>
  <g fill="#fff">
    <circle cx="266" cy="275" r="5.5"/>
    <circle cx="350" cy="275" r="5.5"/>
  </g>
</svg>
